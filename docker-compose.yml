# Local version of the whole system:
#   db        - PostgreSQL; data lives in the named volume "pgdata", outside the containers
#   collector - same job as the Container Apps job in Azure: checks BVG every 2 minutes
#   web       - the app users see, on http://localhost:8000
# MQTT stage (optional): docker compose --profile mqtt up --build
#   mqtt       - Mosquitto broker, login required, only reachable from this machine
#   sensor     - the "virtual sensor": publishes BVG departures to bvg/departures/<stop>
#   subscriber - reads bvg/departures/# and writes to the database
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: latenote
      POSTGRES_USER: latenote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latenote -d latenote"]
      interval: 5s
      retries: 10
    # no "ports:" on purpose: only the other containers can reach the database

  collector:
    build: .
    command: ["python", "-m", "latenote.collector", "--loop", "--interval", "120"]
    environment: &app-env
      DATABASE_URL: postgresql://latenote:${POSTGRES_PASSWORD}@db:5432/latenote
      WATCHED_STOPS: ${WATCHED_STOPS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    healthcheck:
      disable: true  # the image's health check probes the web server, which this container doesn't run
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    # The password file is generated at start from MQTT_PASSWORD (.env), never committed.
    entrypoint: ["sh", "-c", "mosquitto_passwd -b -c /mosquitto/data/passwd latenote \"$$MQTT_PASSWORD\" && chown mosquitto:mosquitto /mosquitto/data/passwd && chmod 600 /mosquitto/data/passwd && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env for the mqtt profile}
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped

  sensor:
    build: .
    profiles: [mqtt]
    command: ["python", "-m", "latenote.sensor", "--loop", "--interval", "120"]
    environment: &mqtt-env
      <<: *app-env
      MQTT_HOST: mqtt
      MQTT_USERNAME: latenote
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    healthcheck: { disable: true }
    depends_on: [mqtt]
    restart: unless-stopped

  subscriber:
    build: .
    profiles: [mqtt]
    command: ["python", "-m", "latenote.subscriber"]
    environment: *mqtt-env
    healthcheck: { disable: true }
    depends_on:
      mqtt:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
