apiVersion: apps/v1
kind: Deployment
metadata:
  name: latenote-web
  labels: { app: latenote, part: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: latenote, part: web }
  template:
    metadata:
      labels: { app: latenote, part: web }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: web
          image: ghcr.io/abdulmuhaiminkhan/bvg-late-note:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: latenote-db } }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: latenote-web
spec:
  type: NodePort
  selector: { app: latenote, part: web }
  ports: [{ port: 80, targetPort: 8000 }]
